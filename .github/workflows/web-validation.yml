name: Validate CloudeAI web app

on:
  push:
    branches:
      - main
      - import-claude-code
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type-check web app
        run: npm run typecheck

      - name: Build web app
        run: npm run build
